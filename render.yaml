services:
  - type: web
    name: multiplaces
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: COMFYUI_URL
        sync: false
      - key: COMFYUI_ACCESS_CLIENT_ID
        sync: false
      - key: COMFYUI_ACCESS_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
